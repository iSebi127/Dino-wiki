<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enciclopedie interactivă de dinozauri — descoperă creaturile preistorice care au dominat Pământul">
  <title>Codex Draconis — Enciclopedia Dinozaurilor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-bg"></div>
    <div class="site-logo">
      <span class="dino-icon">🦕</span>
      <h1 class="site-title">Codex Draconis</h1>
      <p class="site-subtitle">Enciclopedia Dinozaurilor Preistorici</p>
    </div>
    <div class="divider"></div>
    <div class="stats-bar">
      <span> <strong id="dinoCount">—</strong> Specii Documentate</span>
      <span> <strong id="eraCount">—</strong> Ere Geologice</span>
      <span> Peste 250 Milioane de Ani de Istorie</span>
    </div>
  </header>

  <!-- ===== CONTROLS ===== -->
  <section class="controls" aria-label="Filtre și căutare">
    <div class="search-wrap">
      <input
        type="search"
        id="searchInput"
        placeholder="Caută un dinozaur..."
        aria-label="Caută dinozaur"
        autocomplete="off"
      >
    </div>
    <button class="filter-btn active" data-filter="all">Toate Erele</button>
    <button class="filter-btn" data-filter="Jurassic">Jurassic</button>
    <button class="filter-btn" data-filter="Cretaceous">Cretaceous</button>
    <button class="filter-btn" data-filter="Triassic">Triassic</button>
  </section>

  <!-- ===== MAIN GRID ===== -->
  <main>
    <p id="loadingMsg">🌿 Se încarcă Codex-ul din jungla primordială...</p>
    <div id="dinoGrid" role="list" aria-label="Enciclopedie dinozauri"></div>
  </main>

  <!-- ===== MODAL ===== -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Detalii dinozaur">
    <div class="modal">
      <div class="modal-content" id="modalContent">
        <!-- Conținut injectat dinamic de JavaScript -->
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>✦ Codex Draconis — Creat pentru Web Programming ✦ Toate datele sunt stocate în XML ✦</p>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/app.js"></script>

</body>
</html>
