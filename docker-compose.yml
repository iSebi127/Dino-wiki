version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: dinowiki
      POSTGRES_USER: dinouser
      POSTGRES_PASSWORD: dinopass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dinowiki
      SPRING_DATASOURCE_USERNAME: dinouser
      SPRING_DATASOURCE_PASSWORD: dinopass
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app/frontend:ro
      - ./images:/app/images:ro

volumes:
  pgdata:
